site_name: Ad Omnia
site_description: Informatics Engineering Project 2026/2027 - University of Aveiro
site_url: https://ad-omnia.github.io/
repo_url: https://github.com/Ad-Omnia/ad-omnia.github.io
repo_name: Ad-Omnia/ad-omnia.github.io

exclude_docs: |
  0000-*.md

hooks:
  - hooks/minutes.py
  - hooks/milestones.py
  - hooks/journey.py
  - hooks/footer.py

watch:
  - hooks

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/home.js
  - javascripts/nav.js
  - javascripts/deck.js
  - javascripts/minutes.js
  - javascripts/videos.js
  - javascripts/theme.js
  - javascripts/cite.js

theme:
  name: material
  language: en
  favicon: assets/logo-mono-black.svg
  custom_dir: overrides
  logo: assets/logo-colour-black.svg
  icon:
    repo: fontawesome/brands/github
    menu: lucide/menu
    search: lucide/search
    close: lucide/x
    previous: lucide/arrow-left
    next: lucide/arrow-right
    top: lucide/arrow-up
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    #- navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
  # Geist and JetBrains Mono are self-hosted in docs/assets/fonts/ and declared in
  # stylesheets/fonts.css (no Google Fonts request: see the GDPR analysis, section 10).
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Journey: journey.md
  - Milestones:
      - milestones/index.md
  - Minutes:
    - minutes/index.md
  - Team: team.md
  # - Architecture: architecture.md
  # - Reports and Presentations: reports.md

copyright: "© 2026 Ad Omnia · University of Aveiro"

extra:
  videos:
    - title: A Thousand No's
      meta: Brand video · 0:24
      youtube: Q_YQUXswK0s
      poster: assets/videos/a-thousand-nos.jpg
    - title: On the Dotted Line
      meta: Mockup presentation · 0:30
      youtube: G2nFhBWsyhk
      poster: assets/videos/on-the-dotted-line.png
    - title: A New Operational Picture
      meta: SIRESP competition · 3:36
      youtube: oQ3eKdTL0P0
      poster: assets/videos/a-new-operational-picture.png
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ad-Omnia
