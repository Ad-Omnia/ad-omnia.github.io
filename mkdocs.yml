site_name: Ad Omnia
site_description: Informatics Engineering Project 2026/2027 - University of Aveiro
site_url: https://ad-omnia.github.io/
repo_url: https://github.com/Ad-Omnia/ad-omnia.github.io
repo_name: Ad-Omnia/ad-omnia.github.io

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/home.js

theme:
  name: material
  language: en
  favicon: assets/logo-colour-black.svg
  custom_dir: overrides
  logo: assets/logo-colour-black.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    #- navigation.sections
    - navigation.top
    - content.code.copy
  font:
    text: Lato
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Documentation: documentation.md
  - Journey: journey.md
  - Milestones:
      - MS1 - Inception:
          - Project Description: milestones/ms1-inception/project-description.md
          - Project Calendar: milestones/ms1-inception/calendar.md
          - Communication Plan: milestones/ms1-inception/communication-plan.md
      - MS2 - Elaboration:
          - Soon: milestones/ms2-elaboration/ms2-soon.md
      - MS3 - Construction:
          - Soon: milestones/ms3-construction/ms3-soon.md
      - MS4 - Transition:
          - Soon: milestones/ms4-transition/ms4-soon.md
  - Minutes:
    - Minute 1 - 23/09/2026: minutes/2026-09-23_Minute1_AdOmnia.md
    - Minute 2 - 30/09/2026: minutes/2026-09-30_Minute2_AdOmnia.md
  - Team: team.md
  # - Architecture: architecture.md
  # - Reports and Presentations: reports.md

copyright: "© 2026 Ad Omnia · University of Aveiro"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ad-Omnia
