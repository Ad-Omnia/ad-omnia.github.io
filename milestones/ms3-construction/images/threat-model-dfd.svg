<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" font-family="Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ad Omnia data flow diagram with trust boundaries</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.s{font-size:12px;text-anchor:middle;dominant-baseline:central}
.l{font-size:12px;fill:#444441;dominant-baseline:central}
.p rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.75}.p .t{fill:#085041}.p .s{fill:#0F6E56}
.d rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.75}.d .t{fill:#3C3489}.d .s{fill:#534AB7}
.e rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.75}.e .t{fill:#2C2C2A}.e .s{fill:#5F5E5A}
.b{fill:none;stroke:#D85A30;stroke-width:1;stroke-dasharray:6 4}
.f{stroke:#5F5E5A;stroke-width:1.2;fill:none}
</style></defs>
<rect width="680" height="760" fill="#FFFFFF"/>
<rect class="b" x="140" y="30" width="520" height="170" rx="12"/><text class="l" x="152" y="46">Public zone (internet)</text>
<g class="p"><rect x="330" y="130" width="140" height="56" rx="8"/><text class="t" x="400" y="149">Publish endpoint</text><text class="s" x="400" y="168">write-only</text></g>
<path class="f" d="M472 158 L570 158 L570 118" marker-end="url(#a)"/>
<line class="f" x1="400" y1="273" x2="400" y2="188" marker-end="url(#a)"/><text class="l" x="410" y="220">F3 · push, outbound only</text>
<rect class="b" x="140" y="240" width="520" height="395" rx="12"/><text class="l" x="152" y="258">Private instance (local host, one per site)</text>
<rect class="b" x="150" y="448" width="160" height="167" rx="10"/><text class="l" x="158" y="463">Sandbox (Docker)</text>
<g class="e"><rect x="20" y="60" width="100" height="56" rx="4"/><text class="t" x="70" y="79">Citizen</text><text class="s" x="70" y="98">anonymous</text></g>
<g class="p"><rect x="160" y="60" width="140" height="56" rx="8"/><text class="t" x="230" y="79">Public proxy</text><text class="s" x="230" y="98">Nginx, TLS</text></g>
<g class="p"><rect x="330" y="60" width="140" height="56" rx="8"/><text class="t" x="400" y="79">Public API</text><text class="s" x="400" y="98">read-only, citizens</text></g>
<g class="d"><rect x="500" y="60" width="140" height="56" rx="4"/><text class="t" x="570" y="79">Public DB</text><text class="s" x="570" y="98">published state</text></g>
<line class="f" x1="122" y1="88" x2="158" y2="88" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="136" y="74" text-anchor="end">F1</text>
<line class="f" x1="302" y1="88" x2="328" y2="88" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="f" x1="472" y1="88" x2="498" y2="88" marker-start="url(#a)" marker-end="url(#a)"/>
<g class="e"><rect x="20" y="275" width="100" height="56" rx="4"/><text class="t" x="70" y="294">Station</text><text class="s" x="70" y="313">license</text></g>
<g class="p"><rect x="160" y="275" width="140" height="56" rx="8"/><text class="t" x="230" y="294">Private proxy</text><text class="s" x="230" y="313">Nginx</text></g>
<g class="p"><rect x="330" y="275" width="140" height="56" rx="8"/><text class="t" x="400" y="294">CoreAPI</text><text class="s" x="400" y="313">FastAPI</text></g>
<g class="d"><rect x="500" y="275" width="140" height="56" rx="4"/><text class="t" x="570" y="294">Global DB</text><text class="s" x="570" y="313">PostgreSQL, audit</text></g>
<line class="f" x1="122" y1="303" x2="158" y2="303" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="136" y="289" text-anchor="end">F2</text>
<line class="f" x1="302" y1="303" x2="328" y2="303" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="f" x1="472" y1="303" x2="498" y2="303" marker-start="url(#a)" marker-end="url(#a)"/>
<g class="p"><rect x="160" y="370" width="140" height="56" rx="8"/><text class="t" x="230" y="389">Plugin broker</text><text class="s" x="230" y="408">validates, isolates</text></g>
<g class="d"><rect x="330" y="370" width="140" height="56" rx="4"/><text class="t" x="400" y="389">Real-time DB</text><text class="s" x="400" y="408">ingested data</text></g>
<g class="p"><rect x="500" y="370" width="140" height="56" rx="8"/><text class="t" x="570" y="389">AI service</text><text class="s" x="570" y="408">FastAPI, modules 0..N</text></g>
<line class="f" x1="400" y1="333" x2="400" y2="368" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="f" d="M450 333 L450 350 L570 350 L570 368" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="f" d="M350 333 L350 350 L230 350 L230 368" marker-start="url(#a)" marker-end="url(#a)"/>
<g class="p"><rect x="165" y="478" width="130" height="50" rx="8"/><text class="t" x="230" y="494">Plugins</text><text class="s" x="230" y="513">connectors, UI</text></g>
<g class="d"><rect x="165" y="552" width="130" height="50" rx="4"/><text class="t" x="230" y="568">Plugin DB</text><text class="s" x="230" y="587">plugin data</text></g>
<line class="f" x1="230" y1="428" x2="230" y2="476" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="238" y="439">F5</text>
<line class="f" x1="230" y1="530" x2="230" y2="550" marker-start="url(#a)" marker-end="url(#a)"/>
<g class="p"><rect x="330" y="478" width="140" height="50" rx="8"/><text class="t" x="400" y="494">Ingestion</text><text class="s" x="400" y="513">worker + Kafka</text></g>
<line class="f" x1="400" y1="476" x2="400" y2="428" marker-end="url(#a)"/>
<g class="e"><rect x="160" y="665" width="140" height="50" rx="4"/><text class="t" x="230" y="681">Packages</text><text class="s" x="230" y="700">plugins, AI modules</text></g>
<g class="e"><rect x="330" y="665" width="140" height="50" rx="4"/><text class="t" x="400" y="681">External sources</text><text class="s" x="400" y="700">APIs, feeds</text></g>
<line class="f" x1="230" y1="663" x2="230" y2="617" stroke-dasharray="4 3" marker-end="url(#a)"/><text class="l" x="238" y="650">F6</text>
<line class="f" x1="400" y1="663" x2="400" y2="530" marker-end="url(#a)"/><text class="l" x="408" y="650">F4</text>
<g class="p"><rect x="40" y="733" width="14" height="14" rx="3"/></g><text class="l" x="60" y="740">Process</text>
<g class="d"><rect x="130" y="733" width="14" height="14" rx="3"/></g><text class="l" x="150" y="740">Data store</text>
<g class="e"><rect x="240" y="733" width="14" height="14" rx="3"/></g><text class="l" x="260" y="740">External entity</text>
<line class="b" x1="380" y1="740" x2="412" y2="740"/><text class="l" x="420" y="740">Trust boundary</text>
</svg>
